<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>EQL Group</title>
  <meta name="theme-color" content="#F4F5F6">
  <!-- ícone da EQL (arquivos em public/img) -->
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png?v=2">
  <link rel="icon" type="image/png" sizes="64x64" href="/img/favicon-64.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png?v=2">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="EQL Group">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script>
    // aplica tema e tamanho salvos antes de desenhar a tela (evita "piscar")
    try {
      var p = JSON.parse(localStorage.getItem('eql-prefs') || '{}') || {};
      var escuro = p.tema === 'escuro';
      var r = document.documentElement;
      r.dataset.tema = escuro ? 'escuro' : 'claro';
      if (p.texto) r.dataset.texto = p.texto;
      if (p.densidade) r.dataset.densidade = p.densidade;
    } catch (e) {}
  </script>
</head>
<body>
  <div id="root"></div>
  <script src="/app.js"></script>
</body>
</html>
